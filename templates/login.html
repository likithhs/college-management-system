{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-slate-100 dark:bg-slate-900 min-h-[70vh] flex items-center justify-center">
    <div class="max-w-md w-full px-4">
        
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-6" data-aos="zoom-in">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-navy-900 dark:bg-slate-900 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold shadow-md border border-slate-700">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-navy-900 dark:text-white">Student & Faculty Portal</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Access attendance records, marks cards, & e-learning LMS</p>
            </div>

            <form onsubmit="event.preventDefault(); showToast('🔓 Student login portal demo verified!', 'success');" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Registration No. / Staff ID</label>
                    <input type="text" placeholder="e.g. SC2024BCA042" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-xs focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" placeholder="••••••••" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-xs focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-1.5 text-slate-600 dark:text-slate-300 cursor-pointer">
                        <input type="checkbox" class="rounded text-blue-600"> Remember me
                    </label>
                    <a href="#" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl shadow-md transition-all">
                    Sign In to Portal &rarr;
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-100 dark:border-slate-700">
                <p class="text-xs text-slate-500 dark:text-slate-400">Are you an Administrator? <a href="{{ url_for('admin') }}" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">Go to Admin Dashboard</a></p>
            </div>
        </div>

    </div>
</section>
{% endblock %}
